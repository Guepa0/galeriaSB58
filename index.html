<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropa Taulichusco San Borja 58 - Galería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-verde-oscuro: #1aa832;
            --color-verde-claro: #2d8e3e;
            --color-azul: #1e88e5;
            --color-amarillo: #ffc107;
            --color-gris-light: #f5f5f5;
            --color-gris-dark: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-gris-light);
            color: var(--color-gris-dark);
        }

        header {
            background: linear-gradient(135deg, var(--color-verde-oscuro) 0%, var(--color-verde-claro) 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header-text h1 {
            font-size: 28px;
            font-weight: bold;
        }

        .header-text p {
            font-size: 14px;
            opacity: 0.9;
        }

        .btn-admin {
            background-color: var(--color-amarillo);
            color: var(--color-gris-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-logout {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .admin-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--color-verde-oscuro);
            margin-bottom: 20px;
        }

        .admin-header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-primary {
            background-color: var(--color-verde-oscuro);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-login {
            background-color: var(--color-azul);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            margin: 60px auto;
        }

        .login-box h2 {
            color: var(--color-verde-oscuro);
            margin-bottom: 30px;
            font-size: 24px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .activity-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .activities-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .activity-info h3 {
            color: var(--color-verde-oscuro);
            margin-bottom: 5px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-text">
                <h1>🍃 Tropa Taulichusco</h1>
                <p>San Borja 58 - Limatambo</p>
            </div>
            <div>
                <button class="btn-admin" id="btnAdmin" onclick="window.goToAdmin && window.goToAdmin()">Panel Admin</button>
                <button class="btn-logout" id="btnLogout" onclick="window.logout && window.logout()" style="display: none;">Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- GALERÍA PÚBLICA -->
        <div class="view active" id="galleryView">
            <h2 style="text-align: center; color: var(--color-verde-oscuro); font-size: 28px; margin-bottom: 30px;">📸 Nuestras Actividades</h2>
            <div id="activitiesFilter"></div>
        </div>

        <!-- PANEL ADMIN -->
        <div class="view" id="adminView">
            <div class="admin-header">
                <div class="admin-title">🔧 Panel de Administración</div>
                <form onsubmit="window.saveActivity && window.saveActivity(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre de la Actividad *</label>
                            <input type="text" id="activityName" required placeholder="Ej: Tránsito 2026">
                        </div>
                        <div class="form-group">
                            <label>Fecha de la Actividad *</label>
                            <input type="date" id="activityDate" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="activityDescription" placeholder="Describe brevemente..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Link de Google Drive *</label>
                        <input type="text" id="googleDriveLink" required placeholder="Ej: https://drive.google.com/drive/folders/1ABC...">
                    </div>

                    <button type="submit" class="btn-primary">✅ Crear Actividad</button>
                </form>
            </div>

            <div style="margin-top: 40px;">
                <h3 style="color: var(--color-verde-oscuro); margin-bottom: 20px;">📋 Actividades Existentes</h3>
                <div class="activities-list" id="activitiesList">
                    <div class="loading">Cargando...</div>
                </div>
            </div>
        </div>

        <!-- LOGIN -->
        <div class="view" id="loginView">
            <div class="login-box">
                <div style="font-size: 48px; margin-bottom: 20px;">🔐</div>
                <h2>Acceso Restringido</h2>
                <p>Solo administradores pueden acceder</p>
                <button class="btn-login" onclick="window.loginWithGoogle && window.loginWithGoogle()">🔑 Iniciar Sesión con Gmail</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script async defer src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js"></script>
    <script async defer src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js"></script>
    <script async defer src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js"></script>

    <script>
        // Esperar a que todos los scripts carguen
        function waitForFirebase() {
            if (typeof firebase !== 'undefined' && firebase.app) {
                initApp();
            } else {
                setTimeout(waitForFirebase, 500);
            }
        }

        function initApp() {
            console.log('✓ Firebase listo');

            const firebaseConfig = {
                apiKey: "AIzaSyDI-kro274J6dafEEIVRg9EtM3UF8QOF9g",
                authDomain: "galeriasb58.firebaseapp.com",
                projectId: "galeriasb58",
                storageBucket: "galeriasb58.firebaseapp.storage",
                messagingSenderId: "367406205049",
                appId: "1:367406205049:web:b4f0d31dbc302c210a6ca8"
            };

            try {
                firebase.initializeApp(firebaseConfig);
            } catch(e) {
                console.log('Firebase ya inicializado');
            }

            const auth = firebase.auth();
            const db = firebase.firestore();

            let currentUser = null;

            auth.onAuthStateChanged(user => {
                console.log('Auth:', user ? user.email : 'no');
                currentUser = user;
                updateUI();
            });

            function updateUI() {
                const galleryView = document.getElementById('galleryView');
                const adminView = document.getElementById('adminView');
                const loginView = document.getElementById('loginView');
                const btnAdmin = document.getElementById('btnAdmin');
                const btnLogout = document.getElementById('btnLogout');

                galleryView.classList.remove('active');
                adminView.classList.remove('active');
                loginView.classList.remove('active');

                if (currentUser) {
                    console.log('Mostrando admin');
                    adminView.classList.add('active');
                    btnAdmin.style.display = 'none';
                    btnLogout.style.display = 'block';
                    loadAdminActivities();
                } else {
                    console.log('Mostrando galería');
                    galleryView.classList.add('active');
                    btnAdmin.style.display = 'block';
                    btnLogout.style.display = 'none';
                    loadGalleryActivities();
                }
            }

            window.goToAdmin = function() {
                const adminView = document.getElementById('adminView');
                const loginView = document.getElementById('loginView');
                const galleryView = document.getElementById('galleryView');

                galleryView.classList.remove('active');
                adminView.classList.remove('active');
                loginView.classList.remove('active');

                if (currentUser) {
                    adminView.classList.add('active');
                } else {
                    loginView.classList.add('active');
                }
            };

            window.loginWithGoogle = function() {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(err => alert('Error: ' + err.message));
            };

            window.logout = function() {
                auth.signOut().then(() => {
                    currentUser = null;
                    updateUI();
                });
            };

            window.saveActivity = function(e) {
                e.preventDefault();
                if (!currentUser) return alert('No autenticado');

                const name = document.getElementById('activityName').value;
                const date = document.getElementById('activityDate').value;
                const description = document.getElementById('activityDescription').value;
                const driveLink = document.getElementById('googleDriveLink').value;

                db.collection('actividades').add({
                    name, date, description, driveLink,
                    createdBy: currentUser.uid,
                    createdAt: new Date()
                }).then(() => {
                    alert('✅ Creada');
                    document.getElementById('activityName').value = '';
                    document.getElementById('activityDate').value = '';
                    document.getElementById('activityDescription').value = '';
                    document.getElementById('googleDriveLink').value = '';
                    loadAdminActivities();
                }).catch(e => alert('Error: ' + e.message));
            };

            window.deleteActivity = function(id) {
                if (confirm('¿Eliminar?')) {
                    db.collection('actividades').doc(id).delete().then(() => {
                        alert('✅ Eliminada');
                        loadAdminActivities();
                    });
                }
            };

            function loadGalleryActivities() {
                db.collection('actividades').orderBy('date', 'desc').onSnapshot(snap => {
                    const filter = document.getElementById('activitiesFilter');
                    filter.innerHTML = '';
                    if (snap.empty) {
                        filter.innerHTML = '<div class="empty-state">📭 Sin actividades</div>';
                        return;
                    }
                    snap.forEach(doc => {
                        const data = doc.data();
                        const card = document.createElement('div');
                        card.style.cssText = 'background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);';
                        card.innerHTML = `<strong>${data.name}</strong><br>📅 ${formatDate(data.date)}`;
                        filter.appendChild(card);
                    });
                });
            }

            function loadAdminActivities() {
                if (!currentUser) return;
                const list = document.getElementById('activitiesList');
                db.collection('actividades').where('createdBy', '==', currentUser.uid).orderBy('date', 'desc').onSnapshot(snap => {
                    list.innerHTML = '';
                    if (snap.empty) {
                        list.innerHTML = '<div class="empty-state">📭 Sin actividades</div>';
                        return;
                    }
                    snap.forEach(doc => {
                        const data = doc.data();
                        const item = document.createElement('div');
                        item.className = 'activity-item';
                        item.innerHTML = `
                            <div class="activity-info">
                                <h3>${data.name}</h3>
                                <p>📅 ${formatDate(data.date)}</p>
                            </div>
                            <button class="btn-danger" onclick="window.deleteActivity('${doc.id}')">🗑️</button>
                        `;
                        list.appendChild(item);
                    });
                });
            }

            function formatDate(d) {
                return new Date(d).toLocaleDateString('es-ES', {year: 'numeric', month: 'long', day: 'numeric'});
            }

            console.log('✓ App inicializada');
        }

        // Iniciar cuando carguen los scripts
        waitForFirebase();
    </script>
</body>
</html>
